schema: spec-driven

context: |
  Project: formal-gates
  Tech stack: Go CLI plus Markdown prompt files.
  Domain: lightweight independent AI review orchestration.
  Independent gates come only from package-local gates/*.md. Shared review
  rules come only from prompts/reviewer-base.md. SKILL.md is the sole workflow
  order owner. The external VCS owns snapshots and diffs; formal-gates does not
  implement version control or retain an evidence graph.
  Guarantee documented normal use and common operator mistakes only. Do not
  add adversarial hardening, compatibility paths, or framework layers unless a
  confirmed requirement needs them.
