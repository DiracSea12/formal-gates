name: Portable Validation

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Release assets:
# - formal-gates-windows-amd64.exe, portable-canary-windows-amd64.json, SHA256SUMS-windows-amd64.txt
# - formal-gates-macos-arm64, portable-canary-macos-arm64.json, SHA256SUMS-macos-arm64.txt
# - formal-gates-macos-amd64, portable-canary-macos-amd64.json, SHA256SUMS-macos-amd64.txt
# - formal-gates-linux-amd64, portable-canary-linux-amd64.json, SHA256SUMS-linux-amd64.txt

jobs:
  go-validation:
    name: Go validation (${{ matrix.suffix }}, ${{ matrix.check }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
        check: [tests, race, canary]
        exclude:
          - os: windows-latest
            check: race
        include:
          - os: windows-latest
            suffix: windows-amd64
            perforce: ntx64
            binary: formal-gates-windows-amd64.exe
          - os: macos-latest
            suffix: macos-arm64
            perforce: macosx12arm64
            binary: formal-gates-macos-arm64
          - os: macos-15-intel
            suffix: macos-amd64
            perforce: macosx1015x86_64
            binary: formal-gates-macos-amd64
          - os: ubuntu-latest
            suffix: linux-amd64
            perforce: linux26x86_64
            binary: formal-gates-linux-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Subversion (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion
      - name: Install Subversion (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install subversion
      - name: Install native VCS tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "formal-gates-vcs"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $svnArchive = Join-Path $env:RUNNER_TEMP "sliksvn.zip"
          Invoke-WebRequest https://sliksvn.com/download/slik-subversion-1-14-5-x64/ -OutFile $svnArchive
          Expand-Archive -Path $svnArchive -DestinationPath $tools
          $svnInstaller = Join-Path $tools "Slik-Subversion-1.14.5-x64.msi"
          $installation = Start-Process msiexec.exe -ArgumentList "/i `"$svnInstaller`" /qn /norestart ADDLOCAL=ALL" -Wait -PassThru
          if ($installation.ExitCode -notin @(0, 3010)) { throw "Subversion installer exited with $($installation.ExitCode)" }
          Invoke-WebRequest https://cdist2.perforce.com/perforce/r25.2/bin.${{ matrix.perforce }}/p4.exe -OutFile (Join-Path $tools "p4.exe")
          Invoke-WebRequest https://cdist2.perforce.com/perforce/r25.2/bin.${{ matrix.perforce }}/p4d.exe -OutFile (Join-Path $tools "p4d.exe")
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ([Environment]::GetEnvironmentVariable("Path", "Machine") -split ';') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Perforce (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tools="$RUNNER_TEMP/formal-gates-vcs"
          mkdir -p "$tools"
          curl -fsSL https://cdist2.perforce.com/perforce/r25.2/bin.${{ matrix.perforce }}/p4 -o "$tools/p4"
          curl -fsSL https://cdist2.perforce.com/perforce/r25.2/bin.${{ matrix.perforce }}/p4d -o "$tools/p4d"
          chmod +x "$tools/p4" "$tools/p4d"
          echo "$tools" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Configure Go execution environment
        shell: bash
        run: |
          GOCACHE="$(go env GOCACHE)"
          GOMODCACHE="$(go env GOMODCACHE)"
          printf 'GOCACHE=%s\nGOMODCACHE=%s\nGODEBUG=%s\n' "$GOCACHE" "$GOMODCACHE" "${GODEBUG:+$GODEBUG,}memprofilerate=0" >> "$GITHUB_ENV"
      - name: Build native CLI (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist bin mkdir bin
          go build -o bin\formal-gates.exe ./cmd/formal-gates
      - name: Build native CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p bin
          go build -o bin/formal-gates ./cmd/formal-gates
      - name: Assemble published-source archive fixture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveRoot = Join-Path $env:RUNNER_TEMP "formal-gates-published-source"
          $archiveZip = Join-Path $env:RUNNER_TEMP "formal-gates-published-source.zip"
          git archive --format=zip -o $archiveZip HEAD
          Expand-Archive -Path $archiveZip -DestinationPath $archiveRoot -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $archiveRoot "bin") | Out-Null
          Copy-Item bin/formal-gates.exe (Join-Path $archiveRoot "bin/formal-gates.exe") -Force
          "FORMAL_GATES_ARCHIVE_ROOT=$archiveRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Assemble published-source archive fixture (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive_root="$RUNNER_TEMP/formal-gates-published-source"
          mkdir -p "$archive_root/bin"
          git archive --format=tar HEAD | tar -xf - -C "$archive_root"
          cp bin/formal-gates "$archive_root/bin/formal-gates"
          chmod +x "$archive_root/bin/formal-gates"
          echo "FORMAL_GATES_ARCHIVE_ROOT=$archive_root" >> "$GITHUB_ENV"
      - name: Run Go tests
        if: matrix.check == 'tests'
        run: go test ./... -json -count=1 -timeout=0 -tags=qastructure -parallel=20
      - name: Run go vet
        if: matrix.check == 'tests'
        run: go vet ./...
      - name: Run Go race tests (Unix)
        if: matrix.check == 'race' && runner.os != 'Windows'
        shell: bash
        run: go test -json -count=1 -timeout=0 -race ./internal/validate ./internal/cli
      - name: Validate package (Windows)
        if: matrix.check == 'canary' && runner.os == 'Windows'
        shell: cmd
        run: |
          bin\formal-gates.exe package validate --root "%FORMAL_GATES_ARCHIVE_ROOT%"
      - name: Validate package (Unix)
        if: matrix.check == 'canary' && runner.os != 'Windows'
        shell: bash
        run: |
          bin/formal-gates package validate --root "$FORMAL_GATES_ARCHIVE_ROOT"
      - name: Run native portable canary (Windows)
        if: matrix.check == 'canary' && runner.os == 'Windows'
        shell: cmd
        run: |
          bin\formal-gates.exe canary portable --root "%FORMAL_GATES_ARCHIVE_ROOT%" --format json > portable-canary.json
          set "canary_exit_code=%ERRORLEVEL%"
          type portable-canary.json
          exit /b %canary_exit_code%
      - name: Run native portable canary (Unix)
        if: matrix.check == 'canary' && runner.os != 'Windows'
        shell: bash
        run: |
          bin/formal-gates canary portable --root "$FORMAL_GATES_ARCHIVE_ROOT" --format json | tee portable-canary.json
      - name: Prepare release evidence names (Windows)
        if: matrix.check == 'canary' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item bin/formal-gates.exe ${{ matrix.binary }}
          Copy-Item portable-canary.json portable-canary-${{ matrix.suffix }}.json
      - name: Prepare release evidence names (Unix)
        if: matrix.check == 'canary' && runner.os != 'Windows'
        shell: bash
        run: |
          cp bin/formal-gates "${{ matrix.binary }}"
          cp portable-canary.json "portable-canary-${{ matrix.suffix }}.json"
      - name: Write release checksums (Windows)
        if: matrix.check == 'canary' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 ${{ matrix.binary }} | ForEach-Object { "$($_.Hash.ToLower())  ${{ matrix.binary }}" } > SHA256SUMS-${{ matrix.suffix }}.txt
          Get-FileHash -Algorithm SHA256 portable-canary-${{ matrix.suffix }}.json | ForEach-Object { "$($_.Hash.ToLower())  portable-canary-${{ matrix.suffix }}.json" } >> SHA256SUMS-${{ matrix.suffix }}.txt
      - name: Write release checksums (Unix)
        if: matrix.check == 'canary' && runner.os != 'Windows'
        shell: bash
        run: |
          shasum -a 256 "${{ matrix.binary }}" "portable-canary-${{ matrix.suffix }}.json" > "SHA256SUMS-${{ matrix.suffix }}.txt"
      - name: Write CI checksums (Windows)
        if: matrix.check == 'canary' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item SHA256SUMS-${{ matrix.suffix }}.txt SHA256SUMS
      - name: Write CI checksums (Unix)
        if: matrix.check == 'canary' && runner.os != 'Windows'
        shell: bash
        run: |
          cp "SHA256SUMS-${{ matrix.suffix }}.txt" SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: matrix.check == 'canary'
        with:
          name: formal-gates-${{ matrix.suffix }}
          path: |
            formal-gates-*
            portable-canary-*.json
            SHA256SUMS*.txt

  release-evidence:
    name: Upload release evidence (${{ matrix.suffix }})
    if: github.event_name == 'release'
    needs: go-validation
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-amd64
            binary: formal-gates-windows-amd64.exe
          - os: macos-latest
            suffix: macos-arm64
            binary: formal-gates-macos-arm64
          - os: macos-15-intel
            suffix: macos-amd64
            binary: formal-gates-macos-amd64
          - os: ubuntu-latest
            suffix: linux-amd64
            binary: formal-gates-linux-amd64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: formal-gates-${{ matrix.suffix }}
      - name: Upload release evidence (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:GITHUB_REF_NAME ${{ matrix.binary }} portable-canary-${{ matrix.suffix }}.json SHA256SUMS-${{ matrix.suffix }}.txt --clobber --repo $env:GITHUB_REPOSITORY
      - name: Upload release evidence (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.binary }}" "portable-canary-${{ matrix.suffix }}.json" "SHA256SUMS-${{ matrix.suffix }}.txt" --clobber --repo "$GITHUB_REPOSITORY"
