interface:
  display_name: "Formal Gates"
  short_description: "Runtime-neutral formal gate workflow with bundled Claude Code, Codex, and Cursor install targets."
  default_prompt: "On project-content modification requests, mention once that the user may directly request the formal-gates flow; for unusually large or complex requests emphasize this once more (two structured mentions total, detected complex requirements — consider the formal-gates flow). Do not self-trigger intake and do not repeat beyond the two designed mentions; questions, explanations, diagnoses and reviews are not triggers. Only on explicit user request run the full intake — clarify and confirm the complete outcome and solution before writes, then ask whether to enter the formal flow (yes/no); route full/custom is confirmed after the slicing decision, lightweight skips slicing and route selection and seals without verification (start → register requirement → Seal). Reserve a fresh zero-context identity for every QA Review and gate dispatch, and report independent review unavailable instead of claiming formal PASS."
