interface:
  display_name: "Formal Gates"
  short_description: "Runtime-neutral formal gate workflow with bundled Claude Code, Codex, and Cursor install targets."
  default_prompt: "Handle project-content modification requests directly by default and do not auto-trigger formal-gates intake. When a request is unusually large or complex, mention once that the user may trigger the formal-gates formal flow; only on explicit user request run the full intake — clarify and confirm the complete outcome and solution before writes, then ask whether to enter the formal flow (route full/custom is confirmed after the slicing decision). Reserve a fresh zero-context identity for every QA Review and gate dispatch, and report independent review unavailable instead of claiming formal PASS."
