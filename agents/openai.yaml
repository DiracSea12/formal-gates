interface:
  display_name: "Formal Gates"
  short_description: "Runtime-neutral formal gate workflow with bundled Claude Code, Codex, Cursor, DeepSeek Harness, and ZCode install targets."
  default_prompt: "On project-content modification requests, mention once that the user may directly request the formal-gates flow; for unusually large or complex requests emphasize this once more (two structured mentions total, detected complex requirements — consider the formal-gates flow). Do not self-trigger intake and do not repeat beyond the two designed mentions; questions, explanations, diagnoses and reviews are not triggers. Only on explicit user request run the full intake — clarify and confirm the complete outcome and solution before writes, then enter the formal flow; route default/full/custom is confirmed after the slicing decision. Present three independent options: 默认/default (recommended: every ordinary gate, no blackbox or whitebox QA), full（QA 阶段较重，适合大型任务）, and custom (choose at least one candidate, including the full list). The recommendation requires user confirmation; preserve the chosen route identity, including custom with the full list. In the candidate engine, child default/full select every ordinary gate and ordinary QA is excluded from candidates, selection, and execution; master merge QA and merge gate remain mandatory. Lightweight is a separate start mode that skips slicing and route selection and seals without verification (start → register requirement → Seal). Reserve a fresh zero-context identity for every QA Review and gate dispatch, and report independent review unavailable instead of claiming formal PASS."
